# Citadel's build images for the Builds role (H1, tools/build-images/README.md): builds the Android, Node and Rust
# images, checks the Android one builds the hello-world APK, pushes all three to ghcr.io, and prints each one's digest
# and size for tools/build-images/images.json (machines pull them by that digest). Runs when a branch other than the
# ship pipeline's changes tools/build-images/, and by hand. GitHub's own runner (Josh's pick on #2106's card): free for
# this public repo, and nothing lands on a member's PC.
name: build-images

on:
  push:
    branches-ignore: [main, 'land/**', 'check/**', 'early/**']
    paths:
      - 'tools/build-images/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build, test and push
        run: |
          set -eu
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo '### images.json lines' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for kind in android node rust; do
            tag="ghcr.io/$owner/citadel-build-$kind:${GITHUB_SHA::12}"
            docker build --pull -t "$tag" -f "tools/build-images/$kind/Dockerfile" tools/build-images
            if [ "$kind" = android ]; then
              docker volume create citadel-gradle >/dev/null
              docker run --rm -v citadel-gradle:/cache/gradle "$tag" citadel-hello-apk | tail -n 3
            fi
            docker push "$tag"
            digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag")
            mb=$(( $(docker image inspect --format '{{.Size}}' "$tag") / 1000000 ))
            line="\"$kind\": { \"image\": \"$digest\", \"mb\": $mb },"
            echo "$line"
            echo "$line" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
