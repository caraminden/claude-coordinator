# Heavy jobs on Citadel's own CI (#1160), from the kit's template (kit/skills/scheme-setup/templates/citadel-heavy.yml,
# whose header says how it works). Most of Citadel's minions run a few test files with citadel-test, not this; it takes
# a full `npm test` or the like off perigee. Prompt evals run Claude, so they stay on perigee (--here).
name: citadel-heavy
run-name: heavy ${{ inputs.id }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: the snapshot commit
        required: true
      command:
        description: the command line, for bash
        required: true
      id:
        description: names the run
        required: true
      minutes:
        description: the time limit; Citadel sends a longer one for long jobs (citadel-heavy --long, #1363)
        required: false
        default: '60'
      long:
        description: true for a long job (citadel-heavy --long), which runs on the runner with the long label alone (#1592)
        required: false
        default: 'false'

permissions:
  contents: read
  id-token: write # the run's own token, no secret: the ask below

jobs:
  heavy:
    # Only the runner with the side label (#1347): heavy jobs back to back on the first runner, one 36 minutes long, sent
    # four ships in a row to the suite on perigee on 2026-11-20. The first runner stays the ships' (tests.yml, #1240);
    # a heavy job waits behind a proof instead, and heavy-ci.ts waits too while CI is busy. A long job goes to the runner
    # with the long label (#1592): on 2026-11-22 one held the side runner from 02:04 to 07:30 and five proofs queued behind it.
    runs-on: ${{ vars.CI_RUNNER == 'github' && 'ubuntu-latest' || (inputs.long == 'true' && fromJSON('["self-hosted", "citadel-ci-linux", "citadel-ci-linux-long"]') || fromJSON('["self-hosted", "citadel-ci-linux", "citadel-ci-linux-side"]')) }}
    timeout-minutes: ${{ fromJSON(inputs.minutes || '60') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0 # tests read the history
      - uses: actions/setup-node@v4
        with:
          node-version: 26 # perigee's
      # Deploys first (#1902): while a ship is in line this run is stopped here and Citadel starts it again (tools/ci-hold-ask.ts).
      - name: ask Citadel whether ships go first
        run: if [ -f tools/ci-hold-ask.ts ]; then node tools/ci-hold-ask.ts; fi # a snapshot from before #1902 has none
      # As in tests.yml (#1863): without them the type check and the property tests can't run.
      - name: devDependencies for the tests
        if: hashFiles('package-lock.json') != ''
        run: npm ci --ignore-scripts --no-audit --no-fund
      # As in tests.yml: Node 26's libatomic1 and the sqlite3 CLI from their .debs when the distro lacks them, and the
      # runner user's systemd for the tests that start units.
      - name: libatomic1, sqlite3 and the user's systemd
        run: |
          set -euo pipefail
          if ! command -v sqlite3 >/dev/null || ! /sbin/ldconfig -p | grep -q 'libatomic\.so\.1'; then
            dir=$HOME/.local/debs
            if [ ! -x "$dir/usr/bin/sqlite3" ]; then
              mkdir -p "$dir" && cd "$dir"
              apt-get download libatomic1 sqlite3
              for d in *.deb; do dpkg -x "$d" .; done
            fi
            echo "LD_LIBRARY_PATH=$dir/usr/lib/x86_64-linux-gnu" >>"$GITHUB_ENV"
            echo "$dir/usr/bin" >>"$GITHUB_PATH"
          fi
          run=/run/user/$(id -u)
          if [ -S "$run/bus" ]; then
            echo "XDG_RUNTIME_DIR=$run" >>"$GITHUB_ENV"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$run/bus" >>"$GITHUB_ENV"
          fi
      # What killed or cancelled jobs left running (#1900), and this job's own temp folder (TMPDIR, kept per runner).
      - name: clear what earlier jobs left running
        continue-on-error: true
        run: if [ -f test/ci-leftovers.ts ]; then node test/ci-leftovers.ts start; fi # an older snapshot has none
      # test/ps1-lint.test.ts skips without pwsh and PSScriptAnalyzer, so a failed install fails the job
      # rather than quietly dropping the lint. Both go in the runner's own home (no root), once.
      - name: pwsh and PSScriptAnalyzer for the .ps1 lint
        run: |
          set -euo pipefail
          v=7.6.9 dir=$HOME/.local/pwsh
          if [ ! -x "$dir/$v/pwsh" ]; then
            mkdir -p "$dir/$v"
            curl -fsSL "https://github.com/PowerShell/PowerShell/releases/download/v$v/powershell-$v-linux-x64.tar.gz" | tar -xz -C "$dir/$v"
            chmod +x "$dir/$v/pwsh"
          fi
          echo "$dir/$v" >>"$GITHUB_PATH"
          "$dir/$v/pwsh" -NoProfile -Command 'if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -eq 1.25.0)) { Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force }'
      # Chrome for Testing's headless shell, where test/browser.ts looks for Playwright's (the build perigee has).
      - name: headless Chromium for the browser tests
        run: |
          set -euo pipefail
          v=156.0.8078.4 dir=$HOME/.cache/ms-playwright/chromium_headless_shell-1248
          if [ ! -x "$dir/chrome-headless-shell-linux64/chrome-headless-shell" ]; then
            mkdir -p "$dir"
            curl -fsSL -o "$RUNNER_TEMP/chs.zip" "https://storage.googleapis.com/chrome-for-testing-public/$v/linux64/chrome-headless-shell-linux64.zip"
            python3 -m zipfile -e "$RUNNER_TEMP/chs.zip" "$dir"
            chmod +x "$dir/chrome-headless-shell-linux64/chrome-headless-shell"
          fi

      - name: the command
        shell: bash
        env:
          COMMAND: ${{ inputs.command }}
          CITADEL_HEAVY_HELD: '1' # a citadel-heavy inside the command runs straight away
        run: |
          set +e
          echo '=== citadel-heavy: the command starts ==='
          # Niced, so the scheme's ship tests on the same PC get the CPU first.
          # A window in the machine's log, so a ship's suite beside it keeps no suite time (#2082); an older snapshot has no script.
          window=
          [ ! -x tools/ci-window.sh ] || window=tools/ci-window.sh
          if command -v nice >/dev/null; then $window nice -n 19 bash -c "$COMMAND"; else $window bash -c "$COMMAND"; fi
          rc=$?
          # A newline first: output with none at its end would hide the marker mid-line (heavy-ci.ts drops this line again).
          printf '\n=== citadel-heavy: the command exited %s ===\n' "$rc"
          exit $rc
      # A cancel leaves a window open (tools/ci-window.sh --close).
      - name: close this job's window
        if: always()
        continue-on-error: true
        run: if [ -x tools/ci-window.sh ]; then tools/ci-window.sh --close; fi
      # Only this job's: a suite stopped at its limit or cancelled never got to its own cleanup (#1900).
      - name: clear what this job left running
        if: always()
        continue-on-error: true
        run: if [ -f test/ci-leftovers.ts ]; then node test/ci-leftovers.ts end; fi # an older snapshot has none
