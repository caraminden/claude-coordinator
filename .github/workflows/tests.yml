# The full suite, on Cara's desktop (the Linux runner in WSL: tools/ci-runner/README.md) instead of perigee (#523).
# tools/land.sh pushes the rebased commit to land/<branch> and waits for this run on that exact commit; when no
# runner is online or it doesn't answer in time, land.sh runs the suite on perigee itself.
# A ship's own check (#1567, tools/own-check.sh): before it joins the line, land.sh pushes its rebased commit to
# check/<branch> while the check runner is free. That run is a ship's run in every step, niced and on the runner with
# the check label only, so it is never a second land run and never on GitHub's own runners; a green one is the
# ship's run in line too when its commit comes out the same.
# The early next train (#1568, land.sh's early_next): while a train's run goes, land.sh pushes the train that comes next,
# stacked on it, to early/<branch>; a ship's run in every step, niced, on a ship runner, and never on GitHub's own runners.
# A land that touches no pipeline file leaves out the pipeline's own test files (#581, tools/pipeline-files.txt), so the
# whole suite also runs on main every night, pipeline tests included.
name: tests
on:
  push:
    branches: ['land/**', 'check/**', 'early/**']
  schedule:
    - cron: '30 13 * * *' # the quietest hour for lands: no commit reached main at 13:xx UTC in the 14 days to 2026-11-12
  workflow_dispatch:

# One suite at a time on the desktop, however many runners there are: two at once (2026-11-11, load 30-35 on its 32
# threads) failed in a different file every run. Landings come one at a time anyway. Any other run (the nightly, or one
# started by hand) has a group of its own: a run waiting in a group cancels the one waiting before it, which would be a
# landing's. It waits for the lands instead, and yields the CPU to one that starts while it runs (below). A ship's own
# check (check/**) is one at a time in a group of its own: at most one of them beside a land's run (Cara, 2026-11-22,
# "Gated, after C and B": one extra runner, used only when free). The early next train's run (early/**, #1568) has a group
# per branch: it goes niced on a second ship runner while the train ahead's run goes, and once its train comes out the
# same it is that train's run, still going while the next train's early run starts (Cara, 2026-11-22, "Low-priority run
# on a ship runner").
concurrency:
  group: ${{ startsWith(github.ref, 'refs/heads/land/') && 'citadel-tests' || (startsWith(github.ref, 'refs/heads/check/') && 'citadel-check' || (startsWith(github.ref, 'refs/heads/early/') && format('citadel-early-{0}', github.ref_name) || 'citadel-off-land')) }}
  cancel-in-progress: false

# actions: read for the wait for the lands' runs (below).
permissions:
  contents: read
  actions: read
  id-token: write # the run's own token, no secret: tools/ci-numbers.sh's (the citadel:ci-store skill) and the test steps' counts for the Releases page (tools/ci-progress.ts, #1368)

jobs:
  test:
    # A land's run takes either Linux runner; any other (the nightly, one started by hand) only the one with the side
    # label, as flake-proof.yml's proofs do, so the other is always free for a land (#1240). Its wait for the lands
    # below holds its runner, which on the lands' runner would keep the land it waits for from starting. A ship's own
    # check takes only the runner with the check label, never GitHub's own (whatever CI_RUNNER says) nor a land's. An
    # early next train's run (early/, #1568) takes a land's runner beside the lands' run, niced, never GitHub's own.
    runs-on: ${{ startsWith(github.ref, 'refs/heads/check/') && fromJSON('["self-hosted", "citadel-ci-linux-check"]') || (startsWith(github.ref, 'refs/heads/early/') && fromJSON('["self-hosted", "citadel-ci-linux"]') || (vars.CI_RUNNER == 'github' && 'ubuntu-latest' || (startsWith(github.ref, 'refs/heads/land/') && fromJSON('["self-hosted", "citadel-ci-linux"]') || fromJSON('["self-hosted", "citadel-ci-linux", "citadel-ci-linux-side"]')))) }}
    # land.sh gives up on the run 9 minutes after a runner starts it (LAND_CI_TIMEOUT, #1361; 6 until #1606), the clock step's up to 2 min included, or 3 more
    # (LAND_CI_RERUN) for a run rerunning its failed files alone (#1374), plus its burn-in's time (up to 2.5 min, #1443); this only stops one nobody waits for. The suite's own limit is run-tests.sh's 10 minutes; a run that isn't a land's waits
    # up to 30 more for the lands.
    timeout-minutes: ${{ (startsWith(github.ref, 'refs/heads/land/') || startsWith(github.ref, 'refs/heads/check/') || startsWith(github.ref, 'refs/heads/early/')) && 16 || 45 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tests read the history (the last release's schema, branches)
      - uses: actions/setup-node@v4
        with:
          node-version: 26 # perigee's
      # fast-check, the property tests' library (#1657, ADR 0029): Citadel's one devDependency, from the lockfile, no install scripts.
      - name: devDependencies for the tests
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Node 26 needs libatomic1, and deploy.sh, backup.sh and prune.sh the sqlite3 CLI. A fresh distro has neither,
      # and a job has no root, so until someone runs `apt-get install -y libatomic1 sqlite3` there as root they are
      # unpacked from their .debs into the runner's home.
      - name: libatomic1 and sqlite3, when the distro lacks them
        run: |
          set -euo pipefail
          if ! command -v sqlite3 >/dev/null || ! /sbin/ldconfig -p | grep -q 'libatomic\.so\.1'; then
            dir=$HOME/.local/debs
            if [ ! -x "$dir/usr/bin/sqlite3" ]; then
              mkdir -p "$dir" && cd "$dir"
              apt-get download libatomic1 sqlite3
              for d in *.deb; do dpkg -x "$d" .; done
            fi
            echo "LD_LIBRARY_PATH=$dir/usr/lib/x86_64-linux-gnu" >>"$GITHUB_ENV"
            echo "$dir/usr/bin" >>"$GITHUB_PATH"
          fi
      # Turns in tests start their units with systemd-run --user, as on perigee. Without the user's manager they
      # fall back to running inside the server, so the real path would go untested (and since #519 that fallback
      # raises an alert a test counts).
      - name: the runner user's systemd
        run: |
          dir=/run/user/$(id -u)
          [ -S "$dir/bus" ] || { echo "No systemd user manager for $(id -un). As root in the distro: loginctl enable-linger $(id -un)"; exit 1; }
          echo "XDG_RUNTIME_DIR=$dir" >>"$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$dir/bus" >>"$GITHUB_ENV"
      # Two clock keepers skew the WSL clock, which every distro on the PC shares (#542): WSL's own chrony steers it
      # to the Windows clock while a distro's systemd-timesyncd steps it to NTP, and chrony retunes the kernel tick
      # after every step. On 2026-11-11 the clocks ran 7% fast, then 2% slow after a reboot, with the wall clock
      # stepped every 32 s, and timing tests failed at random. The raw clock is the one nothing adjusts (measured
      # then: within 0.005% of NTP). A skew that passes (the keeper settling after a distro starts) gets 2 minutes
      # before the step fails (#900); tools/land.sh reads this step's failure by its name, so keep the two in step.
      - name: the runner's clock
        run: |
          python3 -c "
          import time as t
          raw = lambda: t.clock_gettime(t.CLOCK_MONOTONIC_RAW)
          end = raw() + 120
          while True:
              a, b = t.monotonic(), raw(); t.sleep(2)
              d = (t.monotonic() - a) / (raw() - b) - 1
              print(f'the clock runs {d:+.2%} against the raw clock', flush=True)
              if abs(d) <= 0.01: break
              if raw() > end: raise SystemExit(3)
              t.sleep(8)" && exit 0 || rc=$?
          [ "$rc" = 3 ] || exit "$rc"
          echo "The kernel clock is skewed: a systemd-timesyncd in some WSL distro on this PC is fighting WSL's own clock keeper."
          echo "Here it is $(systemctl is-active systemd-timesyncd 2>&1), $(systemctl is-enabled systemd-timesyncd 2>&1). It must be masked in every distro (wsl -l -v lists them)."
          echo "On the desktop, in PowerShell, for each:"
          echo "  wsl -d <distro> -u root -- systemctl mask --now systemd-timesyncd"
          echo "The clock settles within a minute of that (tools/ci-runner/README.md, Citadel's own tests)."
          exit 1
      # test/ps1-lint.test.ts skips without pwsh and PSScriptAnalyzer, so a failed install fails the job
      # rather than quietly dropping the lint. Both go in the runner's own home (no root), once.
      - name: pwsh and PSScriptAnalyzer for the .ps1 lint
        run: |
          set -euo pipefail
          v=7.6.9 dir=$HOME/.local/pwsh
          if [ ! -x "$dir/$v/pwsh" ]; then
            mkdir -p "$dir/$v"
            curl -fsSL "https://github.com/PowerShell/PowerShell/releases/download/v$v/powershell-$v-linux-x64.tar.gz" | tar -xz -C "$dir/$v"
            chmod +x "$dir/$v/pwsh"
          fi
          echo "$dir/$v" >>"$GITHUB_PATH"
          "$dir/$v/pwsh" -NoProfile -Command 'if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -eq 1.25.0)) { Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force }'
      # test/desktop-launcher-trial.test.ts builds the kit launcher's trial rules with the .NET 8 SDK (#1396) and skips
      # without one, so it goes where the test looks (~/.dotnet, as on perigee), in the runner's own home, once.
      - name: the .NET 8 SDK for the desktop launcher's tests
        run: |
          set -euo pipefail
          if ! "$HOME/.dotnet/dotnet" --list-sdks 2>/dev/null | grep -q '^8\.'; then
            curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/dotnet-install.sh" https://dot.net/v1/dotnet-install.sh
            bash "$RUNNER_TEMP/dotnet-install.sh" --channel 8.0 --install-dir "$HOME/.dotnet" --no-path
          fi
          "$HOME/.dotnet/dotnet" --list-sdks
      # Chrome for Testing's headless shell, where test/browser.ts looks for Playwright's (the build perigee has).
      - name: headless Chromium for the browser tests
        run: |
          set -euo pipefail
          v=156.0.8078.4 dir=$HOME/.cache/ms-playwright/chromium_headless_shell-1248
          if [ ! -x "$dir/chrome-headless-shell-linux64/chrome-headless-shell" ]; then
            mkdir -p "$dir"
            curl -fsSL -o "$RUNNER_TEMP/chs.zip" "https://storage.googleapis.com/chrome-for-testing-public/$v/linux64/chrome-headless-shell-linux64.zip"
            python3 -m zipfile -e "$RUNNER_TEMP/chs.zip" "$dir"
            chmod +x "$dir/chrome-headless-shell-linux64/chrome-headless-shell"
          fi
      # A run that isn't a land's (the nightly) starts once no land's run is queued or running, or after 30 minutes of them.
      # Only runs from the last 30 minutes count: a ship's run can wait 15 for a busy runner, then land.sh waits up to 9
      # more (12 with reruns alone, plus the burn-in's up to 3, #1606), and GitHub keeps some abandoned
      # runs "queued" for good (seven from 2026-11-11 evening, their branches long gone, on 2026-11-12).
      - name: wait for the lands
        if: ${{ !startsWith(github.ref, 'refs/heads/land/') && !startsWith(github.ref, 'refs/heads/check/') && !startsWith(github.ref, 'refs/heads/early/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 60); do
            busy=0
            since=$(date -u -d '30 minutes ago' +%FT%TZ)
            for status in queued in_progress; do
              n=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?event=push&status=$status&created=%3E$since&per_page=1" \
                | python3 -c 'import json, sys; print(json.load(sys.stdin)["total_count"])') || n=x
              # A failed read counts as a land running: the wait leans toward the lands, and gives up after 30 minutes.
              [ "$n" = x ] && echo "could not read the $status land runs from GitHub (the curl line above says why)"
              [ "$n" = x ] && n=1
              busy=$((busy + n))
            done
            [ "$busy" = 0 ] && { echo "no land's tests are running: starting"; exit 0; }
            echo "$busy land run(s) queued or running, or unknown; waiting"
            sleep 30
          done
          echo "lands kept running (or GitHub unread) for 30 minutes: starting anyway, niced"
      # The burn-in (#1443): a ship's new and changed test files, and up to 3 tests tools/affected-map.txt maps its changed
      # source files to or that import them (#1456), each run as 10 copies at once before the full suite (tools/burn-in.sh). A failed copy fails the run
      # here, with that copy's output, and land.sh refuses the ship on it as its own red, never a flake. land.sh pushes the
      # ship's base (main as it was) as land-base/<branch> beside land/<branch> (check-base/ beside check/, early-base/ beside early/), so only this ship's changes count; at its
      # CI limit it gives the run this step's time more, once. With no runner the ship's suite runs on perigee, and the
      # burn-in not at all (land.sh says so).
      - name: burn in new and changed tests
        if: ${{ startsWith(github.ref, 'refs/heads/land/') || startsWith(github.ref, 'refs/heads/check/') || startsWith(github.ref, 'refs/heads/early/') }}
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache # each source file compiled once per job, not once per process (#1565)
          BURN_IN_NICE: ${{ (startsWith(github.ref, 'refs/heads/check/') || startsWith(github.ref, 'refs/heads/early/')) && 'nice -n 10' || '' }} # a check or early run yields to a land's run (#1567, #1568)
        run: |
          base=origin/${GITHUB_REF_NAME%%/*}-base/${GITHUB_REF_NAME#*/}
          if ! git rev-parse -q --verify "$base^{commit}" >/dev/null; then
            echo "burn-in: no $base ref from land.sh, so it compares with GitHub's main, which may lack the last ship or two"
            base=$(git merge-base HEAD origin/main)
          fi
          tools/burn-in.sh --ship "$base"
      # The run land.sh makes on perigee when this can't answer: it always ends (a leaked handle hangs a bare
      # `npm test` here), and labels a file that fails under load. Perigee skips no test, so a skip here means this
      # runner lacks something a test needs, and the gate would be weaker than the one it replaces: that is red too.
      - name: the full suite
        id: suite
        # Files at once on the desktop (#564). run-tests.sh's half-the-cores default ran 8 once #552 capped the VM at 16
        # processors, and the suite went from about 60 s to 150 s with the tests' own time unchanged: they mostly wait
        # on servers and timers. GitHub's 4-core runners keep the default.
        # A run that isn't a land's runs niced, so a landing that starts beside it gets the CPU first. A ship's own check
        # runs half as many files at once too (#1567): it shares the 16 processors with a land's run more often than not.
        env:
          CITADEL_TEST_CONCURRENCY: ${{ startsWith(github.ref, 'refs/heads/check/') && '8' || (vars.CI_RUNNER != 'github' && '16' || '') }}
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
          NICENESS: ${{ !startsWith(github.ref, 'refs/heads/land/') && '10' || '0' }}
          LAND_REF: ${{ (startsWith(github.ref, 'refs/heads/land/') || startsWith(github.ref, 'refs/heads/check/') || startsWith(github.ref, 'refs/heads/early/')) && '1' || '' }}
        run: |
          rc=0
          # Each file's seconds in this runner's last run, so the next starts the longest first (tools/suite-runner.ts, #1565).
          mkdir -p "$HOME/.cache" && export CITADEL_TEST_TIMES=$HOME/.cache/citadel-test-times.tsv
          # Its failed files are rerun alone in the next step, not here (#1374): run-tests.sh leaves them in reruns.
          echo "nproc $(nproc), $([ -n "$CITADEL_TEST_CONCURRENCY" ] && echo "$CITADEL_TEST_CONCURRENCY" || echo $((($(nproc) + 1) / 2))) test files at once"
          # The log streams while the suite runs (#560): a run cancelled at land.sh's cap used to show nothing,
          # since the log was only printed once run-tests.sh ended. node prints files in order, so the hung file
          # is the first one with no results.
          : >"$RUNNER_TEMP/tests.log"
          tail -n +1 -f "$RUNNER_TEMP/tests.log" & tailer=$!
          # The file counts and failed files so far, on to the Releases page (#1368); it never fails the step.
          node tools/ci-progress.ts "$RUNNER_TEMP/tests.progress" & poster=$!
          # The window this suite ran in, kept on the machine's disk where every runner on it can read it (#1811): a suite that
          # shared the machine with another suite run reads slow for that reason, not the code's, so the numbers step skips it.
          win=/tmp/citadel-suite-windows-$(id -u); mkdir -p "$win"; find "$win" -type f -mmin +1440 -delete 2>/dev/null || true
          me="$win/${GITHUB_RUN_ID:-0}-$$"; wstart=$(date +%s); echo "$wstart 0" >"$me"
          started=$SECONDS
          DEPLOY_TEST_CPU_WEIGHT= DEPLOY_RERUN_LATER="$RUNNER_TEMP/reruns" nice -n "$NICENESS" tools/run-tests.sh "$RUNNER_TEMP/tests.log" || rc=$?
          wend=$(date +%s); echo "$wstart $wend" >"$me"
          # Overlapped: another run's window started before this one ended and ended after it began (or is still open, written in the last 2 h).
          rm -f "$RUNNER_TEMP/suite-overlap"
          for f in "$win"/*; do
            [ "$f" != "$me" ] || continue
            read -r s e <"$f" || continue
            [ "$e" != 0 ] || { [ -n "$(find "$f" -mmin -120)" ] && e=$wend || continue; }
            if [ "$s" -lt "$wend" ] && [ "$e" -gt "$wstart" ]; then echo "$f" >"$RUNNER_TEMP/suite-overlap"; break; fi
          done
          [ "$rc" != 0 ] || echo "$((SECONDS - started))" >"$RUNNER_TEMP/suite-secs" # a green run's wall time, for the numbers step
          kill "$poster" 2>/dev/null || true # it ends by itself with no run token: bash -e would fail the step on that kill
          wait "$poster" || true # its last send, the final counts (#1667): 5 s at most
          sleep 1; kill "$tailer" # tail prints what it has read: a second for the last lines
          [ "$rc" != 0 ] || grep -q '^ℹ skipped 0$' "$RUNNER_TEMP/tests.log" || { echo "tests were skipped on this runner (the lines with ﹣ above): install what they need"; exit 1; }
          exit "$rc"
      # Numbers per run for the CI page's Numbers tab (higher is worse; a step up wakes the Taskmaster). Never fails the job.
      # A ship's own check or an early run keeps none: its suite ran niced (and a check's narrower), so its time isn't main's line's.
      - name: Keep the run's numbers
        if: ${{ success() && !startsWith(github.ref, 'refs/heads/check/') && !startsWith(github.ref, 'refs/heads/early/') }}
        continue-on-error: true
        run: |
          [ -s "$RUNNER_TEMP/suite-secs" ] || exit 0
          # A run that included the pipeline's own test files (tools/run-tests.sh's "tier all" line, #581) is its own series:
          # it runs ~70-80 s longer, so mixed into suite-time a run of pipeline ships read as a step up (#1700). Runs from before keep suite-time.
          series=suite-time
          ! grep -q '^run-tests: tier all' "$RUNNER_TEMP/tests.log" || series=suite-time-pipeline
          # A suite that shared the machine with another suite run keeps no suite time at all (#1811): load made it slow, not the
          # code, and in either series it would read as a step up against runs that had the machine to themselves. Old rows stay.
          nums=()
          [ -e "$RUNNER_TEMP/suite-overlap" ] || nums+=("$series=$(cat "$RUNNER_TEMP/suite-secs")s")
          nums+=("front-end-size=$(find public -type f -printf '%s\n' | awk '{s+=$1} END {print s}')B")
          tools/ci-numbers.sh "${nums[@]}" || true
      # The full suite's failed files, each rerun alone once to label it flake or real (tools/run-tests.sh), in a step of
      # their own so land.sh sees them start (#1374): on Nov 20 a busy desktop's full suite ended past the reruns'
      # deadline, so no flake was rerun and each red counted as real. At its LAND_CI_TIMEOUT land.sh waits LAND_CI_RERUN
      # (RERUN_WINDOW here, the same number) more for a run in this step, and only then. Its clock starts here, at or
      # before land.sh's (steps run back to back on one runner, and land.sh only extends once the full suite has ended),
      # and the reruns end 30 s short of the window, for the job's end and land.sh's next look: a real red is red in time. It never turns
      # a red run green: land.sh gives a red of flakes only its one fresh run.
      - name: rerun failed files alone
        if: ${{ failure() && steps.suite.conclusion == 'failure' }}
        env:
          NICENESS: ${{ !startsWith(github.ref, 'refs/heads/land/') && '10' || '0' }}
          LAND_REF: ${{ (startsWith(github.ref, 'refs/heads/land/') || startsWith(github.ref, 'refs/heads/check/') || startsWith(github.ref, 'refs/heads/early/')) && '1' || '' }}
          RERUN_WINDOW: 180
        run: |
          [ -s "$RUNNER_TEMP/reruns" ] || { echo "the full suite left nothing to rerun alone"; exit 0; }
          if [ -n "$LAND_REF" ]; then
            export DEPLOY_RERUN_DEADLINE=$(($(date +%s) + RERUN_WINDOW - 30))
            echo "reruns alone end by $(date -u -d "@$DEPLOY_RERUN_DEADLINE" +%T) UTC, before land.sh stops waiting"
          fi
          rc=0
          # Streamed as the full suite's is: a run cancelled mid-rerun still shows the labels so far.
          : >"$RUNNER_TEMP/reruns.log"
          tail -n +1 -f "$RUNNER_TEMP/reruns.log" & tailer=$!
          node tools/ci-progress.ts "$RUNNER_TEMP/reruns.progress" & poster=$! # the reruns' counts, as the full suite's
          DEPLOY_TEST_CPU_WEIGHT= DEPLOY_RERUN_FROM="$RUNNER_TEMP/reruns" nice -n "$NICENESS" tools/run-tests.sh "$RUNNER_TEMP/reruns.log" || rc=$?
          kill "$poster" 2>/dev/null || true # it ends by itself with no run token: bash -e would fail the step on that kill
          wait "$poster" || true # its last send, the final counts (#1667): 5 s at most
          sleep 1; kill "$tailer"
          exit "$rc"
      # A cancelled step's processes live on until the job ends, so a hang still shows what it was waiting in:
      # the test file's node process and whatever it started.
      - name: what was still running
        if: cancelled() || failure()
        run: ps -u "$(id -u)" -o pid,ppid,etimes,stat,args --forest | cut -c1-400
