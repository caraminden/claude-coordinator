# Heavy commands give way first (#1338): systemd-oomd kills one here once this slice has been stalled on memory past 60%
# for 20 s, sooner than anything else in Citadel (citadel.slice and the user root: 90% for 60 s; turns, ships and
# Taskmasters: never for their own slice). It replaces CachyOS's drop-in of the same name
# (/usr/lib/systemd/user/slice.d/10-oomd-per-slice-defaults.conf, 80% for 30 s) in this slice only. The killed command's
# turn lives: tools/heavy-unit tells it only the command stopped. Install, check and undo: deploy/oomd.md.
[Slice]
ManagedOOMSwap=kill
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=60%
ManagedOOMMemoryPressureDurationSec=20s
