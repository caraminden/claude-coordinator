# systemd-oomd never kills for this slice's own memory pressure (#1338). Its name replaces CachyOS's drop-in for every
# slice, /usr/lib/systemd/user/slice.d/10-oomd-per-slice-defaults.conf (kill past 80% pressure for 30 s), in this one
# slice: a drop-in with the same name in a unit's own folder wins over the type-wide one (systemd.unit(5)). On
# 2026-11-20 that rule killed 23 host turns, each time while this slice sat at its own MemoryHigh line. Now the host
# turns slow down there, and a kill comes only from citadel.slice's or the user root's rule (90% for 60 s), whose
# victims are taken in order: heavy commands, ships and containers first, minion turns and ultra reviews (avoid) last, the server
# and Taskmasters (omit) never. Cara, 2026-11-20, on #1335's choices page: "B: no kill on the turns' line: Go". The swap
# rule stays as CachyOS has it (once the box's swap and its memory are both over 90% used, oomd.conf), which by design
# ignores avoid and omit marks on cgroups a user owns. Install, check and undo: deploy/oomd.md.
[Slice]
ManagedOOMSwap=kill
ManagedOOMMemoryPressure=auto
