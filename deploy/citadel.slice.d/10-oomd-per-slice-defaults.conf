# systemd-oomd kills here only when all of Citadel has been stalled on memory past 90% for a full minute (#1338), not
# CachyOS's 80% for 30 s (/usr/lib/systemd/user/slice.d/10-oomd-per-slice-defaults.conf, which a drop-in of the same
# name in this unit's folder replaces). That is the last resort of the memory design (reports/memory-kills-2026-11-20.md
# in the scheme's shared folder, "who gives way"): before it, turns slow down. oomd then kills one leaf cgroup below,
# the one with the most reclaim activity, skipping omit (the server, Taskmasters, the tools pool) and taking avoid
# (minion turns, ultra reviews) only once nothing else is left. People's containers can't be marked: podman hands each
# one's payload cgroup to the container's own uid, and oomd honours a mark only from root or the user who runs it, so
# oomd ranks a container (all of one person's turns) like a ship. Install, check and undo: deploy/oomd.md.
[Slice]
ManagedOOMSwap=kill
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=90%
ManagedOOMMemoryPressureDurationSec=60s
