# Keep the server responsive while turns compile (#326). Install and check: deploy/priority.md.
#
# citadel.slice caps the server, the host turns and every container at 20G together (#1214), so when builds fill it the
# kernel reclaims inside the slice, and the idle server's heap is the coldest memory there: it went
# to zram and every scheme switch had to fault it back in. MemorySwapMax=0 means reclaim takes the
# turns' memory instead. (MemoryLow= would also protect the server's page cache, but a floor only
# holds if every parent cgroup up to the root has one too, and user.slice has none.)
#
# Under real pressure nothing in this file can stop the slice's OOM killer; with no swap for the
# server it picks sooner, and it picks the largest process (a rustc or a claude, usually), adjusted by
# oom_score_adj. User units start at 200 (the user manager's default: a turn container read 200 on
# 2026-11-05) and may go no lower than user@.service's own 100, so 100 makes the server a little less
# likely to be picked than a turn. If the server is picked anyway,
# Restart=always brings it back in 3 s and turns carry on in their own units. MemoryMax=8G in
# resources.conf still caps it alone.
#
# None of this can stop the service starting: systemd ignores OOMScoreAdjust it isn't allowed to set,
# and a cgroup setting the kernel lacks is logged and skipped.
[Service]
MemorySwapMax=0
# The server's share against its siblings in citadel.slice: each person's container and
# citadel-turns.slice, all at the default 100, and a landing's test run at 500 (tools/run-tests.sh). It only matters when CPUs are short, and the server
# is mostly idle, so this costs a busy build very little.
CPUWeight=1000
OOMScoreAdjust=100
