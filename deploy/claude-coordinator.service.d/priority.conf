# Keep the server responsive while turns compile (#326). Install and check: deploy/priority.md.
#
# citadel.slice caps the server, the host turns and every container at 22G together (#1214), so when builds fill it the
# kernel reclaims inside the slice, and the idle server's heap is the coldest memory there: it went
# to zram and every scheme switch had to fault it back in. MemorySwapMax=0 means reclaim takes the
# turns' memory instead.
#
# Under real pressure nothing in this file can stop the slice's OOM killer; with no swap for the
# server it picks sooner, and it picks the largest process (a rustc or a claude, usually), adjusted by
# oom_score_adj. User units start at 200 (the user manager's default: a turn container read 200 on
# 2026-11-05) and may go no lower than user@.service's own 100, so 100 makes the server a little less
# likely to be picked than a turn. If the server is picked anyway,
# Restart=always brings it back in 3 s and turns carry on in their own units. MemoryMax=8G in
# resources.conf still caps it alone.
#
# None of this can stop the service starting: systemd ignores OOMScoreAdjust it isn't allowed to set,
# and a cgroup setting the kernel lacks is logged and skipped.
[Service]
MemorySwapMax=0
# A floor for the server's page cache, the database's hot pages above all (#1458). On 2026-11-21 kswapd took 2.4G of
# the server's pages in 2 minutes with 13G free on the box, and only 24-98M of the 1.9G database stayed in memory, so
# reads waited on the disk. SQLite's own cache can't hold them: every commit by the writer's connection (about 15 a
# second) empties the server connection's cache, and an mmap too. 3G covers the heap (about 0.5-1.5G, never swapped)
# and the hot pages. A floor counts against reclaim that starts at or below the highest parent that has one too. So
# once loaded it holds at once against citadel.slice's own MemoryHigh/MemoryMax reclaim (as the turns' floor does,
# citadel-turns.slice), with citadel.slice's floor (deploy/citadel.slice) passing it down. The box-wide reclaimer
# (kswapd, the #1458 case) starts at the root and ignores it until user@1002.service, user-1002.slice and user.slice,
# which are root's (Cody's), get a floor too. Check: memory.low, and the low line of memory.events.
MemoryLow=3G
# Huge pages only where a program asks (#1458, src/unit-thp.ts): a failed huge-page fault wakes the reclaimer, which then
# discarded the database's cached pages with gigabytes free. Children the server forks (scopes, `--scope` turns) inherit
# it; the service units it starts get it from systemd-run. systemd 260+; an older one logs the line and skips it.
MemoryTHP=madvise
# The server's share against its siblings in citadel.slice: each person's container and
# citadel-turns.slice, all at the default 100, and a landing's test run at 500 (tools/run-tests.sh). It only matters when CPUs are short, and the server
# is mostly idle, so this costs a busy build very little.
CPUWeight=1000
OOMScoreAdjust=100
# systemd-oomd never picks the server (#1257). On 2026-11-20 it killed this unit 11 times in 3 minutes (10:44-10:47 PST)
# while the server held 0.5-1.9G: when user@.service's memory pressure stays over oomd's limit, it SIGKILLs the
# leaf cgroup with the most reclaim activity, not the biggest, and a restarting server faulting its heap and the
# database back in topped that list again 15 s after each kill. omit takes it off the list, so oomd takes a turn,
# a land, a test run or a container instead; the kernel's OOM killer still enforces MemoryMax=8G (resources.conf).
# oomd honours this for user@.service's pressure kills because the cgroup and that monitored cgroup share an owner;
# a root-owned policy (a swap kill on -.slice) ignores it, and the server has no swap to be picked for there.
# A systemd without the key logs the line and skips it. Deploys don't daemon-reload: see priority.md.
ManagedOOMPreference=omit
