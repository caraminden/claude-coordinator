# systemd restarts a hung server (#1135). A crash already restarted it (Restart=always); a hang didn't. The server pings
# every 15 s from its event loop (src/sd-watchdog.ts, through systemd-notify, so NotifyAccess=all), and 60 s without a
# ping is a hang: the longest stall recorded live was 14.2 s (#1125 fixed it), and a boot takes about 2 s.
#
# Install by hand, once the server that pings is live: link it, daemon-reload, then restart, since the server reads
# WATCHDOG_USEC only at start (a reload alone would arm the limit on a server that doesn't ping yet):
#   ln -s ~/claude-coordinator/deploy/claude-coordinator.service.d/watchdog.conf ~/.config/systemd/user/claude-coordinator.service.d/
#   systemctl --user daemon-reload && systemctl --user restart claude-coordinator
# To undo: rm the link, daemon-reload, restart.
[Service]
WatchdogSec=60
NotifyAccess=all
# SIGKILL, not the default SIGABRT: dumping the core of a 1 GB heap would hold the restart up.
WatchdogSignal=SIGKILL
# A watchdog stop leaves a mark; the next boot records it as a health event with the last stall (tools/watchdog-exit.ts).
# The leading - means a failure here never fails the stop.
ExecStopPost=-/usr/bin/node %h/claude-coordinator/tools/watchdog-exit.ts
