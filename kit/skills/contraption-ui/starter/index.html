<!doctype html>
<!-- A contraption's page on Citadel UI (citadel:contraption-ui). Copy this folder as your app's web
     root and replace the sample content. Citadel's files come from /apps/_citadel/ on the same origin.
     The page is a chat (ui/chat.js) over a message box (ui/composer.js), with a stand-in agent. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My app</title>
  <!-- Your own installed app: relative link, and id and scope /apps/<name>/ in it (references/installing.md).
       icon.svg and the icon-*.png files are stand-ins: redraw them, and register icon as /icon.svg. -->
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/apps/_citadel/theme.css">
  <link rel="stylesheet" href="/apps/_citadel/ui/base.css">
  <link rel="stylesheet" href="app.css">
  <!-- The app rail draws itself in its default mode; for your own left column see rail-and-drawers.md. -->
  <script type="module" src="/apps/_citadel/rail.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <nav id="sections" aria-label="Sections">
    <h2>Sections</h2>
    <a href="#">Notes</a>
  </nav>
  <main id="main">
    <header class="bar">
      <h1>My app</h1>
      <!-- A setting that takes effect at once is a switch: a native checkbox with Citadel's .cui-switch. -->
      <!-- data-tip gives anything a tooltip (ui/tip.js, mounted in app.js): extra detail on hover. -->
      <label data-tip="Sample replies come every 100 ms instead of 400"><input type="checkbox" role="switch" class="cui-switch" id="quick"> Quick replies</label>
    </header>
    <!-- A status line, always there and 22 px tall even when empty, so a status never moves the page (ui/status.js). -->
    <div id="status"></div>
    <div class="chat" id="chat"></div>
    <div class="compose" id="compose"></div>
  </main>
</body>
</html>
