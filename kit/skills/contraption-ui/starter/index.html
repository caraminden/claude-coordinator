<!doctype html>
<!-- A contraption's page on Citadel UI (citadel:contraption-ui). Copy this folder as your app's web
     root and replace the sample content. Citadel's files come from /apps/_citadel/ on the same origin.
     The page is a chat (ui/chat.js) over a message box (ui/composer.js), with a stand-in agent. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My app</title>
  <link rel="stylesheet" href="/apps/_citadel/theme.css">
  <link rel="stylesheet" href="/apps/_citadel/ui/base.css">
  <link rel="stylesheet" href="app.css">
  <!-- The app rail draws itself in its default mode; for your own left column see rail-and-drawers.md. -->
  <script type="module" src="/apps/_citadel/rail.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <nav id="sections" aria-label="Sections">
    <h2>Sections</h2>
    <a href="#">Notes</a>
  </nav>
  <main id="main">
    <header class="bar">
      <h1>My app</h1>
    </header>
    <div class="cui-notice" role="status" id="notice" hidden></div>
    <div class="chat" id="chat"></div>
    <div class="compose" id="compose"></div>
  </main>
</body>
</html>
