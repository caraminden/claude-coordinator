<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Starter review page (docs-and-mocks skill). Copy beside mockkit.js and mockkit.css, rename, and
     replace every REPLACE: the same real screen in each board, one idea changed per take. -->
<title>REPLACE: the question, e.g. Stores panel: three takes</title>
<link rel="stylesheet" href="mockkit.css">
<!-- <link rel="stylesheet" href="theme.css"> the scheme's theme, if it has one -->
<script src="mockkit.js"></script>
<style>
/* The mocked screen, in the scheme's real values. Everything here is the page's own; mk-* is the kit. */
.scr { height: 100%; display: flex; flex-direction: column; gap: 4px; padding: 10px; background: var(--mk-panel); font-size: 13px; }
.scr .bar { display: flex; gap: 4px; }
.scr .bar button { font: inherit; font-size: 12px; padding: 3px 8px; line-height: 1.3; border: 1px solid var(--mk-line); border-radius: 4px; background: none; cursor: pointer; }
.scr .bar button[aria-pressed="true"] { border-color: var(--mk-accent); color: var(--mk-accent); }
.scr .grp { display: flex; align-items: center; gap: 6px; padding: 3px 0; line-height: 1.3; background: none; border: 0; font: inherit; font-weight: 600; cursor: pointer; text-align: left; }
.scr .row { display: flex; justify-content: space-between; padding: 3px 6px; line-height: 1.3; background: var(--mk-sunk); border-radius: 3px; }
.scr .row:hover { outline: 1px solid var(--mk-accent); }
</style>
</head>
<body class="mk">
<main class="mk-page wide">
  <header class="mk-head">
    <div class="mk-kicker">REPLACE scheme · review page · #N</div>
    <h1>REPLACE: the question</h1>
    <div class="mk-meta"><span class="mk-status" data-status="review">Needs a pick</span><span>REPLACE date</span><span>REPLACE what it builds on</span></div>
    <p class="mk-lede">REPLACE: what the reader decides, and what to try in each board.</p>
  </header>

  <div id="takes"></div>

  <section>
    <h2>What every take shares</h2>
    <ul><li>REPLACE: what stays the same, so no board's note repeats it.</li></ul>
  </section>
</main>
<script>
// REPLACE with the scheme's real data.
const DATA = [
  { group: 'Ores', items: [['Copper ore', 42], ['Iron ore', 7]] },
  { group: 'Herbs', items: [['Gildmoss', 120], ['Hareswift', 0]] },
];

const takes = mock.boards('#takes', {
  size: { w: 360, h: 260 },
  state: { open: ['Ores'], filter: 'all' },
  boards: [
    { id: 'now', label: 'Now', title: 'What ships today', note: 'REPLACE', pick: false },
    { id: 'A', title: 'REPLACE: the idea', note: 'REPLACE: what it does; what it costs.', rec: true },
    { id: 'B', title: 'REPLACE: the idea', note: 'REPLACE', state: { filter: 'has' } },
  ],
  render: (b, s) => `<div class="scr">
    <div class="bar">${['all', 'has'].map((f) => `<button data-on="click:filter" data-arg="${f}" aria-pressed="${s.filter === f}">${f === 'all' ? 'All' : 'In stock'}</button>`).join('')}</div>
    ${DATA.map((g) => `
      <button class="grp" data-on="click:fold" data-arg="${mock.esc(g.group)}">${s.open.includes(g.group) ? '▾' : '▸'} ${mock.esc(g.group)}</button>
      ${s.open.includes(g.group) ? g.items.filter(([, n]) => s.filter === 'all' || n > 0).map(([name, n]) => `<div class="row"><span>${mock.esc(name)}</span><span>${n}</span></div>`).join('') : ''}`).join('')}
  </div>`,
  on: {
    fold: (s, { arg }) => ({ open: s.open.includes(arg) ? s.open.filter((g) => g !== arg) : [...s.open, arg] }),
    filter: (s, { arg }) => ({ filter: arg }),
  },
});
</script>
</body>
</html>
