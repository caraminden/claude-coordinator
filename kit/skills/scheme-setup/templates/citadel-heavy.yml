# Heavy jobs on the scheme's own CI (Citadel #1160). Copy to .github/workflows/citadel-heavy.yml.
#
# With this on the default branch, a heavy `citadel-heavy <command>` in a minion's turn (minutes of busy CPU by its past
# runs, or `--heavy`; Citadel #1629) runs here, on the scheme's runners, instead of on perigee (quick or idle jobs run
# on perigee at once): Citadel's tools/heavy-ci.ts pushes the minion's working copy as a snapshot commit
# (refs/citadel-heavy/<id>, which no push trigger sees), starts this workflow on it, waits, prints what the command
# printed between the two markers below and exits with its status. `citadel-heavy --long <command>` only queues the job:
# Citadel starts it here at night (from 2am, in the CI PC's job hours) with a longer `minutes`,
# and wakes the minion with the result (#1363). On the PC Citadel's own ships test on, a job waits while one is in line
# (4 hours at most; Citadel #1902): Citadel stops it, starts it again and tells its minion. A repo without this file runs its heavy jobs in
# perigee's one small, low-priority slot: slow, on purpose (Josh, 2026-11-20: "perigee is fine and nothing breaks,
# we just ship less").
#
# To adopt it:
#   1. Runners: the scheme's own, which a computer lending it CI registers by itself once a workflow asks for the
#      label. Swap <runner-label> below for theirs (<scheme-slug>-ci-linux, or <scheme-slug>-ci on Windows). Only one
#      heavy job per repo runs at a time; a second runner, so one always stays free for ship tests, is the odd case
#      `ci_runners` add (count 2) is for.
#   2. Toolchain: add the setup steps the scheme's own CI uses (setup-node, a Rust toolchain, setup-uv, mise-action...)
#      where it says so below. Jobs that need perigee itself (data only it has, its Android emulator) stay there
#      with `citadel-heavy --here`, and jobs that run Claude never come here, so leave those out.
#   3. Ship it: GitHub starts a dispatch only from the default branch's copy.
# Buying compute: the repo variable CI_RUNNER=github runs it on GitHub's own runners, which may cost Actions minutes (private repo or larger runners), so
# ask a person first. Keep the name, run-name, inputs and markers: heavy-ci.ts finds the run and the output by them.
name: citadel-heavy
run-name: heavy ${{ inputs.id }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: the snapshot commit
        required: true
      command:
        description: the command line, for bash
        required: true
      id:
        description: names the run
        required: true
      minutes:
        description: the time limit; Citadel sends a longer one for long jobs (citadel-heavy --long, #1363)
        required: false
        default: '60'

permissions:
  contents: read
  id-token: write # the run's own token, no secret: the last step's call to Citadel (#2120)

jobs:
  heavy:
    # citadel-heavy-suite (Citadel #2120): no runner carries it by itself; Citadel puts it on one runner of the PC lending
    # the scheme CI that has room for a full suite, in its owner's order, and takes it off once the job starts there.
    runs-on: ${{ vars.CI_RUNNER == 'github' && 'ubuntu-latest' || fromJSON('["self-hosted", "<runner-label>", "citadel-heavy-suite"]') }}
    timeout-minutes: ${{ fromJSON(inputs.minutes || '60') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          clean: false # a self-hosted runner keeps target/, node_modules/ and the like between runs: warm builds

      # The scheme's toolchain setup goes here.

      - name: the command
        shell: bash
        env:
          COMMAND: ${{ inputs.command }}
          CITADEL_HEAVY_HELD: '1' # a citadel-heavy inside the command runs straight away
        run: |
          set +e
          echo '=== citadel-heavy: the command starts ==='
          # Niced, so the scheme's ship tests on the same PC get the CPU first.
          if command -v nice >/dev/null; then nice -n 19 bash -c "$COMMAND"; else bash -c "$COMMAND"; fi
          rc=$?
          # A newline first: output with none at its end would hide the marker mid-line (heavy-ci.ts drops this line again).
          printf '\n=== citadel-heavy: the command exited %s ===\n' "$rc"
          exit $rc
      # Its room on the PC is free at once (Citadel #2120): Citadel placed this job there by its heavy label and held room
      # for it; without this step the room is freed at Citadel's next look at GitHub. The run's own token, no secret.
      - name: tell Citadel its room is free
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          t=$(curl -fsS -m 15 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=citadel-ci-store" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')
          curl -fsS -m 15 -X POST -H "Authorization: Bearer $t" -H 'content-type: application/json' -d "{\"runner\":\"$RUNNER_NAME\"}" "${CITADEL_STORE_URL:-http://perigee.tail59477f.ts.net:8574}/api/heavy/done" || true
