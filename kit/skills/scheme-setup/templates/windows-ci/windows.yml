# Citadel's Windows CI kit (kit/skills/scheme-setup/templates/windows-ci/README.md), from Peek Auras' windows.yml.
# Copy to .github/workflows/windows.yml, swap <scheme-slug> for the scheme's runner label stem, and fill in the build.
#
# Everything that needs no desktop runs here, on the scheme's build runners (<scheme-slug>-ci: Windows services under
# NETWORK SERVICE on a computer lending the scheme CI, which registers one by itself once this asks for the label).
# Jobs that open windows or read the screen are desktop.yml, a workflow of its own on the session runner, so a desktop runner that is gone or busy never holds this workflow's
# concurrency group, and a landing gets a build verdict even while the desktop is away (Peek Auras, 2026-11-06).
# Setting the repository variable CI_RUNNER to `github` sends the runs to GitHub's windows-latest (minutes billed at 2x
# there). Ask Cara before setting it. A run started with the input route=github goes there too: Citadel's runner pool
# starts one when no machine could take a job for 10 minutes (a public repo, or a private one under 80% of its included
# minutes; Citadel's src/runner-fallback.ts). Keep the input's name: the pool sends it.
name: windows

# When it runs (#603): on the commit a landing is about to land, which tools/land.sh pushes to land/<branch> (list this
# file in its CI_WORKFLOWS), and when started by hand. Not on pull requests: only the land run decides, on the exact
# commit that lands, and a PR's run tests a commit that is stale once main moves while doubling the runners' work
# (Peek Auras, 2026-11-12). Not on main either: every commit there already passed here on land/**. Citadel's PR
# watcher expects no checks on a PR when no workflow runs on pull_request, so it stays quiet.
# This shape needs land.sh's CI gate. A scheme without it never pushes land/**: give it `branches: [main]` and
# `pull_request:` instead, or nothing runs.
on:
  push:
    branches: ['land/**']
  workflow_dispatch:
    inputs:
      route:
        description: "github: run on GitHub's runners (Citadel's runner pool sets it when no machine can take the job)"
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # One group per workflow, never shared with desktop.yml's.
  group: windows-${{ github.ref }}
  # tools/land.sh cancels its own runs that no longer count, and lets a landed commit's run finish.
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ (vars.CI_RUNNER == 'github' || inputs.route == 'github') && 'windows-latest' || fromJSON('["self-hosted", "<scheme-slug>-ci"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Every .ps1 in the repo parses, names only types that exist on Windows, and passes PSScriptAnalyzer
      # (tools/ci-win/lint-ps1.ps1). Minions run the same lint on perigee before they push.
      - name: Lint PowerShell
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
            Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          }
          $files = @(git ls-files '*.ps1')
          if ($files) { powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci-win/lint-ps1.ps1 @files; exit $LASTEXITCODE }
      # desktop.yml's screen check compiles and runs here too: broken, it would only show as every desktop job NOT RUN.
      # Exit 1 (no screen to read) is what a service gets; 2 is the check itself broken.
      - name: Screen check compiles
        run: |
          rc=0; powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/ci-win/screen-check.ps1 || rc=$?
          [ "$rc" -le 1 ]
      # The scheme's own steps: toolchain setup, format, lint, the tests that need no desktop, the release build.
      # The runner's .env already gives mise, rustup and cargo folders of its own (add-runner.ps1).
      - name: Build and test
        run: echo "replace with the scheme's build and tests" && exit 1
