<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Claude Coordinator</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Coordinator">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div id="usage" class="usage" hidden><span class="label"></span><span class="track"><span class="fill"></span></span></div>
    <nav id="crumbs"></nav>
    <span id="me"></span>
  </header>
  <main id="app"></main>

  <template id="login-tpl">
    <form class="card login" id="login-form">
      <h1>Sign in</h1>
      <label>Your name <input name="name" autocomplete="nickname" required maxlength="40"></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <p class="error" id="login-error" hidden></p>
      <button type="submit">Sign in</button>
    </form>
  </template>

  <script src="/app.js" type="module"></script>
</body>
</html>
