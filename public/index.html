<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <!-- The front end's version, filled in by the server: a page the service worker kept from before a ship sees it is stale (#1144). -->
  <meta name="citadel-version" content="%ASSET_VERSION%">
  <title>%APP_NAME%</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="%APP_NAME%">
  <!-- The installed app's title bar colour, here from the start: installing moves this tab into the app window without a
       reload (#890). With the title bar hidden (#637) the window controls take the page's colour (base.js tintTitleBar);
       the first match wins. A browser tab matches none. -->
  <meta name="theme-color" content="#f6f5f2" media="(display-mode: window-controls-overlay) and (prefers-color-scheme: light)">
  <meta name="theme-color" content="#161514" media="(display-mode: window-controls-overlay) and (prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(display-mode: standalone) and (prefers-color-scheme: light)">
  <meta name="theme-color" content="#201f1d" media="(display-mode: standalone) and (prefers-color-scheme: dark)">
  <!-- Citadel's tokens as --citadel-*, built from style.css: what Citadel UI (ui/) reads, here as in apps. -->
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="ui/base.css">
  <link rel="stylesheet" href="style.css">
  <!-- One file per part, in this order: rules of equal weight win by it. -->
  <link rel="stylesheet" href="thread.css">
  <link rel="stylesheet" href="composer.css">
  <link rel="stylesheet" href="cards.css">
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="project.css">
  <link rel="stylesheet" href="releases.css">
  <link rel="stylesheet" href="reviews.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="skills.css">
</head>
<body>
  <header class="topbar">
    <div class="meters meter-row"><a id="usage" class="usage" data-part="usage-meter" href="#/" hidden><span class="label"></span><span class="track"><span class="fill"></span></span></a></div>
    <nav id="crumbs"></nav>
    <span id="me"></span>
    <button type="button" class="refresh-btn" title="Refresh" aria-label="Refresh">↻</button>
  </header>
  <main id="app"></main>

  <template id="login-tpl">
    <form class="card login" id="login-form">
      <h1>Sign in</h1>
      <label>Login <input name="login" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64"></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <p class="error" id="login-error" hidden></p>
      <button type="submit">Sign in</button>
    </form>
  </template>

  <template id="invite-tpl">
    <form class="card login" id="invite-form">
      <h1>Welcome to Citadel</h1>
      <p class="muted" id="invite-who">Checking your link…</p>
      <input name="login" autocomplete="username" hidden>
      <label>Choose a password <input name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="200"></label>
      <label>Type it again <input name="again" type="password" autocomplete="new-password" required minlength="10" maxlength="200"></label>
      <p class="error" id="invite-error" hidden></p>
      <button type="submit" disabled>Set password and sign in</button>
    </form>
  </template>

  <!-- First, so it hears errors from every module app.js loads (#724). -->
  <script src="error-beacon.js"></script>
  <script src="app.js" type="module"></script>
  <!-- After app.js on purpose: it runs before any module does, to catch one that fails to load. -->
  <script src="boot-guard.js"></script>
</body>
</html>
