<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>%APP_NAME%</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="%APP_NAME%">
  <!-- Citadel's tokens as --citadel-*, built from style.css: what Citadel UI (ui/) reads, here as in apps. -->
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div id="usage" class="usage" hidden><span class="label"></span><span class="track"><span class="fill"></span></span></div>
    <nav id="crumbs"></nav>
    <span id="me"></span>
    <button type="button" class="refresh-btn" title="Refresh" aria-label="Refresh">↻</button>
  </header>
  <main id="app"></main>

  <template id="login-tpl">
    <form class="card login" id="login-form">
      <h1>Sign in</h1>
      <label>Login <input name="login" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64"></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <p class="error" id="login-error" hidden></p>
      <button type="submit">Sign in</button>
    </form>
  </template>

  <template id="invite-tpl">
    <form class="card login" id="invite-form">
      <h1>Welcome to Citadel</h1>
      <p class="muted" id="invite-who">Checking your link…</p>
      <input name="login" autocomplete="username" hidden>
      <label>Choose a password <input name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="200"></label>
      <label>Type it again <input name="again" type="password" autocomplete="new-password" required minlength="10" maxlength="200"></label>
      <p class="error" id="invite-error" hidden></p>
      <button type="submit" disabled>Set password and sign in</button>
    </form>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>
