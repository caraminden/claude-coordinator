<!doctype html>
<!--
  FROZEN ON PURPOSE (#410). Citadel's backup chat with the Citadel scheme's Taskmaster, served at /backup
  for when the main front end is broken, so a person can still get the Taskmaster to fix it.
  Do not restyle, refactor or tidy it along with the rest of the app, and never make it load anything:
  no file from public/, the kit, a CDN or a shared module. Everything it needs is inline, and it shows
  plain text only. Its routes are in src/backup.ts. test/backup.test.ts pins this file's hash: change it
  only to fix this page itself, and update the pin in the same commit.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citadel backup chat</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-bottom: 1px solid rgba(128, 128, 128, 0.4); }
  h1 { flex: 1; margin: 0; font-size: 17px; }
  header a { font-size: 14px; }
  #status { padding: 4px 10px; border-radius: 12px; font-size: 14px; background: rgba(128, 128, 128, 0.2); }
  #status.on { background: #1f7a4d; color: #fff; }
  #problem { display: none; margin: 0; padding: 8px 12px; background: rgba(200, 40, 40, 0.15); }
  #log { flex: 1; overflow-y: auto; padding: 12px; }
  .line { max-width: 60em; margin: 0 0 14px; }
  .who { font-size: 13px; opacity: 0.7; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .user_message .who { font-weight: bold; opacity: 1; }
  .note .text { font-size: 14px; opacity: 0.75; }
  .error .text { color: #d33; }
  form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid rgba(128, 128, 128, 0.4); }
  textarea, input, button { font: inherit; }
  textarea { flex: 1; min-height: 3.2em; max-height: 40vh; padding: 8px; resize: vertical; }
  button { padding: 8px 16px; }
  #login { display: none; flex-direction: column; align-items: stretch; max-width: 22em; border: 0; }
  #login input { padding: 8px; }
</style>
</head>
<body>
<header>
  <h1>Taskmaster backup chat</h1>
  <span id="status">Loading…</span>
  <a href="/c/">Main app</a>
</header>
<p id="problem"></p>
<form id="login">
  <p>Sign in to talk to the Taskmaster.</p>
  <input id="user" autocomplete="username" placeholder="Login" required>
  <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
  <button>Sign in</button>
</form>
<div id="log" aria-live="polite"></div>
<form id="send">
  <textarea id="text" placeholder="Message the Taskmaster (Ctrl+Enter sends)" aria-label="Message"></textarea>
  <button>Send</button>
</form>
<script>
'use strict';
var last = 0;
var timer = null;
var first = true;
var busy = false;
var again = false;
var $ = function (id) { return document.getElementById(id); };

function problem(text) {
  $('problem').textContent = text;
  $('problem').style.display = text ? 'block' : 'none';
}

async function call(path, body) {
  var opts = { credentials: 'same-origin', cache: 'no-store' };
  if (body) opts = { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  var res = await fetch(path, opts);
  var data = {};
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401 && path !== '/api/login') {
    $('login').style.display = 'flex';
    $('send').style.display = 'none';
    $('status').textContent = 'Signed out';
    throw new Error('signed out');
  }
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

function add(line) {
  if (!line.text) return;
  var div = document.createElement('div');
  div.className = 'line ' + line.kind;
  var who = document.createElement('div');
  who.className = 'who';
  who.textContent = line.author + ' · ' + new Date(line.at).toLocaleString();
  var text = document.createElement('div');
  text.className = 'text';
  text.textContent = line.text;
  div.appendChild(who);
  div.appendChild(text);
  $('log').appendChild(div);
}

function running(on) {
  $('status').textContent = on ? 'Taskmaster is working…' : 'Taskmaster is idle';
  $('status').className = on ? 'on' : '';
}

async function poll() {
  // One fetch at a time, so no line is added twice; a call made meanwhile runs once this one ends.
  if (busy) { again = true; return; }
  busy = true;
  clearTimeout(timer);
  try {
    await fetchLines();
  } catch (e) {
    busy = false;
    if (e.message === 'signed out') return;
    problem("Couldn't load messages (" + e.message + "). Retrying.");
  }
  busy = false;
  if (again) { again = false; return poll(); }
  timer = setTimeout(poll, document.hidden ? 15000 : 3000);
}

async function fetchLines() {
  var data = await call('/backup/messages?after=' + last);
  var log = $('log');
  var atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  data.lines.forEach(add);
  if (data.last) last = Math.max(last, data.last);
  running(data.running);
  if (first || (atEnd && data.lines.length)) log.scrollTop = log.scrollHeight;
  first = false;
  problem('');
}

$('send').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  var box = $('text');
  var text = box.value.trim();
  if (!text) return;
  box.value = '';
  try {
    var data = await call('/backup/send', { text: text });
    running(data.running);
    poll();
  } catch (e) {
    if (!box.value) box.value = text;
    if (e.message !== 'signed out') problem("Couldn't send (" + e.message + "). Your message is back in the box; try again.");
  }
});

$('text').addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) {
    ev.preventDefault();
    $('send').requestSubmit();
  }
});

$('login').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  try {
    await call('/api/login', { login: $('user').value, password: $('password').value });
    $('login').style.display = 'none';
    $('send').style.display = 'flex';
    problem('');
    poll();
  } catch (e) {
    problem("Couldn't sign in (" + e.message + ').');
  }
});

document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
poll();
</script>
</body>
</html>
